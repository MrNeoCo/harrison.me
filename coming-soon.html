<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Harrison Arkue Jr. — Coming Soon</title>
<meta name="description" content="The new portfolio of Harrison Arkue Jr. — IT Professional, Lecturer and Programmer — is coming soon.">
<meta name="theme-color" content="#02040A">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Manrope:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#02040A;--b1:#0066FF;--b2:#087BFF;--b3:#20A4FF;--text:#F4F7FF;--muted:#8290A8;--line:rgba(32,164,255,.22);
--display:"Big Shoulders Display","Arial Narrow","Helvetica Neue",Impact,sans-serif;--body:"Manrope","Helvetica Neue",Arial,sans-serif;--ease:cubic-bezier(.22,.7,.2,1);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--b3);outline-offset:4px;border-radius:2px}
.page{position:relative;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:space-between;padding:calc(1.6rem + env(safe-area-inset-top,0px)) clamp(1.4rem,5vw,5rem) calc(1.6rem + env(safe-area-inset-bottom,0px));isolation:isolate;overflow:hidden}
.photo{position:absolute;inset:0;z-index:-3}
.photo img{width:100%;height:100%;object-fit:cover;object-position:78% 10%;transform-origin:75% 25%;animation:breathe 22s ease-in-out infinite alternate}
@keyframes breathe{from{transform:scale(1)}to{transform:scale(1.06)}}
.page::before{content:"";position:absolute;inset:0;z-index:-2;background:linear-gradient(90deg,var(--bg) 0%,rgba(2,4,10,.93) 32%,rgba(2,4,10,.35) 58%,transparent 78%),linear-gradient(0deg,var(--bg) 0%,transparent 30%)}
.aura{position:absolute;inset:-20%;z-index:-1;background:radial-gradient(40% 45% at 70% 40%,rgba(8,123,255,.32),transparent 70%);mix-blend-mode:screen;animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate3d(-3%,2%,0) scale(1)}to{transform:translate3d(4%,-3%,0) scale(1.1)}}
.mark{font-family:var(--display);font-weight:900;font-size:2rem;line-height:1;letter-spacing:.02em}
.mark b{color:var(--b2)}
main{max-width:46rem;padding:3rem 0}
.status{display:inline-flex;align-items:center;gap:.7rem;font-size:.75rem;letter-spacing:.3em;text-transform:uppercase;color:var(--b3)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--b3);box-shadow:0 0 14px var(--b3);animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
h1{margin:1.2rem 0 0;font-family:var(--display);font-weight:800;text-transform:uppercase;line-height:.86;font-size:clamp(4.2rem,min(15vw,21vh),12rem)}
h1 span{display:block;width:max-content;max-width:100%;white-space:nowrap;padding-right:.05em}
.w{background:linear-gradient(180deg,#fff 20%,#b9c6dc 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.g{background:linear-gradient(180deg,#5cc0ff,var(--b2) 45%,var(--b1));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 28px rgba(8,123,255,.45))}
.name{margin:2rem 0 .5rem;font-weight:500;font-size:clamp(1rem,2.2vw,1.25rem);letter-spacing:.04em}
.roles{margin:0;color:var(--muted);font-size:.78rem;letter-spacing:.26em;text-transform:uppercase}
.line{margin:1.6rem 0 2rem;color:#c3cde0;font-weight:300;font-size:clamp(1rem,1.8vw,1.15rem);max-width:30ch}
.bar{position:relative;width:min(260px,70%);height:2px;background:var(--line);overflow:hidden;margin-bottom:2.2rem;border-radius:2px}
.bar::after{content:"";position:absolute;inset:0;width:40%;background:linear-gradient(90deg,transparent,var(--b3),transparent);box-shadow:0 0 12px var(--b3);animation:slide 3.4s var(--ease) infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
.btn{display:inline-flex;align-items:center;gap:.6rem;padding:.95rem 1.7rem;border-radius:999px;font-weight:500;font-size:.88rem;letter-spacing:.04em;background:linear-gradient(135deg,var(--b1),var(--b3));box-shadow:0 8px 40px -10px rgba(0,102,255,.8);transition:transform .6s var(--ease),box-shadow .6s var(--ease)}
.acts{display:flex;flex-wrap:wrap;gap:.9rem}.acts.in{animation-name:in}.btn.ghost{background:rgba(255,255,255,.03);border:1px solid var(--line);box-shadow:none}.btn:hover{transform:translateY(-2px);box-shadow:0 14px 50px -6px rgba(32,164,255,.85)}
footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.6rem 2rem;color:var(--muted);font-size:.8rem}
footer a:hover{color:var(--b3)}
.in{opacity:0;filter:blur(12px);transform:translateY(16px);animation:in 1.6s var(--ease) forwards;animation-delay:var(--d,0s)}
@keyframes in{to{opacity:1;filter:var(--glow,none);transform:none}}
.g{--glow:drop-shadow(0 0 28px rgba(8,123,255,.45))}
@media (max-width:700px){
  .photo img{object-position:80% 20%;transform-origin:80% 20%}
  .page::before{background:linear-gradient(0deg,var(--bg) 12%,rgba(2,4,10,.85) 48%,rgba(2,4,10,.12) 82%),linear-gradient(90deg,rgba(2,4,10,.5),transparent 60%)}
  main{padding:2rem 0 1rem}
  footer{flex-direction:column}
}
@media (max-height:560px) and (orientation:landscape){h1{font-size:4rem}.line{margin:1rem 0}.bar{margin-bottom:1.2rem}main{padding:1rem 0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important}.in{opacity:1;filter:none;transform:none}}
</style>
</head>
